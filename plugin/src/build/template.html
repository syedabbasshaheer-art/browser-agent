/* ══════════ THE REMOTE CONTROL ══════════

   Then it rings the doorbell (comments.sendToClaude); the agent runs the orchestrator (cockpit.mjs inbox),

   Every capability may be missing: the board then stays a read-only page. */

  return CAP.acts.approvals.some(function(a){return a.verb==="plan.accept"&&applied(a)&&(sentHere(a)||String(a.decidedAt||a.askedAt||"")>BUILT_AT)})

/* Two inboxes. approvals/ is the owner's; actions/ is everyone else's. What only the owner can do (answer a question,

/* ══════════ a redraw keeps the viewer's place ══════════
   Every region is drawn as one string. Before a redraw the page notes which control has focus, by a stable key
   (its id, or its action with the ids it carries and the item it sits in), the caret, and what is typed in every
   field; after the redraw it gives them back. Text typed for one thing (a card's note, a question's answer) is
   never carried to another. When the control itself is gone, focus goes to the first control of the item it sat in. */
var HOSTS=["topbar","needs","rail","canvas","bnav","fabslot","overlay"],HOLD=0,MORPH=false,DRAWN={view:null,sheet:null,dialog:null,ans:null};
var FOCUSABLE='button:not([aria-disabled="true"]),a[href],input,textarea,select,[tabindex="0"]';
function hostOf(el){for(var x=el;x&&x!==document.body;x=x.parentNode)if(x.id&&HOSTS.indexOf(x.id)>=0)return x;return null}
function cssq(v){return String(v).replace(/["\\]/g,"\\$&")}
function sigOf(el){
  var d=el.dataset,k=Object.keys(d).filter(function(x){return x!=="tip"&&x!=="tipPos"}).sort().map(function(x){return x+"="+d[x]}).join("&");
  return el.tagName+"|"+k+(d.act?"":"|"+(el.classList[0]||"")+"|"+(el.getAttribute("aria-label")||""));
}
/* the items a control sits in, nearest first, each as a selector that finds it again */
function ctxOf(el,host){
  var out=[];
  for(var x=el.parentNode;x&&x!==host;x=x.parentNode){
    if(x.id){out.push('[id="'+cssq(x.id)+'"]');continue}
    var d=x.dataset||{},ks=["k","off","note","card","sec"];
    for(var i=0;i<ks.length;i++)if(d[ks[i]]!=null&&d[ks[i]]!==""){out.push("."+(x.classList[0]||"x")+"[data-"+ks[i]+'="'+cssq(d[ks[i]])+'"]');break}
  }
  return out;
}
function sameSig(scope,tag,sig){return [].filter.call(scope.querySelectorAll(tag),function(x){return sigOf(x)===sig})}
function grab(){
  var st={vals:{}},el=document.activeElement;
  var keep=function(h,ok){if(!ok)return;[].forEach.call($(h).querySelectorAll("input[id],textarea[id]"+(h==="overlay"?",select[id]":"")),function(x){if(x.id==="anstext"&&DRAWN.ans!==S.ans)return;st.vals[x.id]=x.value})};
  keep("canvas",DRAWN.view===S.view);keep("overlay",DRAWN.sheet===S.sheet&&DRAWN.dialog===S.dialog);
  if(!el||el===document.body)return st;
  var host=hostOf(el);if(!host)return st;
  st.host=host.id;st.id=el.id||"";st.sig=sigOf(el);st.tag=el.tagName;st.ctx=ctxOf(el,host);
  var scope=st.ctx.length?host.querySelector(st.ctx[0]):host;
  st.idx=Math.max(0,sameSig(scope||host,st.tag,st.sig).indexOf(el));
  if(st.id&&st.id in st.vals){try{st.sel=[el.selectionStart,el.selectionEnd]}catch(e){}}
  return st;
}
function give(st){
  Object.keys(st.vals).forEach(function(id){var x=$(id);if(x&&x.value!==st.vals[id])x.value=st.vals[id]});
  if(!st.host)return;
  var host=$(st.host),a=document.activeElement,t=null;
  if(a&&a!==document.body&&a.isConnected&&!(MORPH&&hostOf(a)===host&&sigOf(a)!==st.sig&&a.id!==st.id)){   /* focus is where it was, or was placed on purpose */
    if(st.sel&&a.id===st.id){try{a.setSelectionRange(st.sel[0],st.sel[1])}catch(e){}}
    return;
  }
  if(st.id&&$(st.id)&&host.contains($(st.id)))t=$(st.id);
  if(!t){var scope=st.ctx.length?host.querySelector(st.ctx[0]):host;if(scope){var c=sameSig(scope,st.tag,st.sig);t=c[st.idx]||c[0]||null}}
  for(var i=0;!t&&i<st.ctx.length;i++){var box=host.querySelector(st.ctx[i]);if(box)t=box.querySelector(FOCUSABLE)}
  if(!t)return;
  t.focus({preventScroll:true});
  if(st.sel&&t.id===st.id){try{t.setSelectionRange(st.sel[0],st.sel[1])}catch(e){}}
}
/* run a draw, outermost only: note the place, draw, give it back */
function hold(fn){
  if(HOLD)return fn();
  HOLD=1;var st=grab();
  try{fn()}finally{HOLD=0}
  give(st);
}
/* Put a region's new content in place. On the 30-second timer this changes only what differs (the times, mostly),
   node by node, so nothing else on the page is rebuilt; a part whose shape changed is replaced as a whole. */
function put(el,html){
  if(!MORPH){el.innerHTML=html;return}
  var t=document.createElement(el.tagName);t.innerHTML=html;morphKids(el,t);
}
function morph(a,b){
  if(a.isEqualNode(b))return;
  var i,at=b.attributes;
  for(i=0;i<at.length;i++)if(a.getAttribute(at[i].name)!==at[i].value)a.setAttribute(at[i].name,at[i].value);
  at=[].slice.call(a.attributes);for(i=0;i<at.length;i++)if(!b.hasAttribute(at[i].name))a.removeAttribute(at[i].name);
  morphKids(a,b);
}
function morphKids(a,b){
  var x=a.childNodes,y=b.childNodes,i,same=x.length===y.length;
  for(i=0;same&&i<x.length;i++)same=x[i].nodeType===y[i].nodeType&&x[i].nodeName===y[i].nodeName;
  if(!same){a.innerHTML=b.innerHTML;return}
  for(i=0;i<x.length;i++){if(x[i].nodeType===1)morph(x[i],y[i]);else if(x[i].nodeValue!==y[i].nodeValue)x[i].nodeValue=y[i].nodeValue}
}
/* ══════════ what a screen reader is told ══════════
   One sentence per change, never the feed. Polite (#saypolite): the receipt of a request this visit sent (sent,
   applied, waiting for you), and a new Now sentence or a new line from the agent. Assertive (#sayloud): a refusal,
   and a problem line. The first draw only notes where things stand. */
function sayTo(id,t){var el=$(id);if(!el||!t)return;el.textContent="";el.textContent=t}
function plainOf(html){var t=document.createElement("div");t.innerHTML=html;return t.textContent}
function statusSay(a){
  return a.status==="pending"?"Sent, waiting for the agent":applied(a)?"Applied"+(a.result?". "+a.result:""):a.status==="refused"?"Refused: "+(a.result||"no reason came back.")
    :a.status==="awaiting-confirmation"?"Waiting for you to confirm":String(a.status||"");
}
var SAID=null;
function announce(){
  var top=maxOffset(),rc={},soft=[],loud="",ln=NOW.line||null;
  var nk=NOW.k+"|"+(NOW.card||(NOW.need&&NOW.need.card)||"")+"|"+(NOW.k==="working"&&ln&&ln.offset!=null?ln.offset:"");
  var acts=allActs().filter(sentHere);acts.forEach(function(a){rc[a.key]=String(a.status)});
  if(!SAID){SAID={top:top,rc:rc,now:nk};return}
  /* a problem line that arrived since the last draw: the newest one */
  var prob=L.filter(function(e){return e.say==="problem"&&e.offset!=null&&+e.offset>SAID.top})[0];
  if(prob)loud="Problem"+(prob.card?" on "+prob.card:"")+": "+prob.text;
  /* the newest receipt that changed */
  var ch=acts.filter(function(a){return SAID.rc[a.key]!==rc[a.key]})[0];
  if(ch){var cs=actLabel(ch)+": "+statusSay(ch);if(ch.status==="refused")loud=cs;else soft.push(/[.!?]$/.test(cs)?cs:cs+".")}
  /* a new Now sentence, or a new line from the agent while it works */
  if(nk!==SAID.now&&!(prob&&ln===prob)){
    var t=plainOf(nowSay(NOW));
    if(NOW.k==="working"&&ln&&ln.text)t+=" "+(ln.say==="result"?"Result: ":ln.say==="auto"?"Automatic: ":"")+ln.text;
    soft.push(t);
  }
  SAID={top:top,rc:rc,now:nk};
  if(loud)sayTo("sayloud",loud);
  if(soft.length)sayTo("saypolite",soft.join(" "));
}

/* what was done on a finished card, in the agent's own words: its closing note, the result it posted, and its proof.
   Nothing is invented: every sentence is one already written on the card or in the feed. */
function doneBlock(c){
  if(E.phase[c.id]!=="DONE")return "";
  var sec=sections(c),notes=sec.note.map(function(t){return t.replace(/\s*\(from (?:the owner|a contributor) in the browser, [^)]*\)\s*$/,"")});
  var closing=notes.filter(function(t){return /^(Done|Finished|Closed) (on|by)\b/i.test(t)}).pop()||"";
  var res=null;for(var i=0;i<L.length;i++){if(L[i].card===c.id&&L[i].say==="result"){res=L[i];break}}
  var sum=closing?closing.replace(/^(Done|Finished|Closed) (on|by) [^.]*\.\s*/i,""):res?String(res.text).replace(/^Card [0-9.]+ is done:\s*/i,""):"";
  var when=(closing.match(/\b(\d{4}-\d\d-\d\d)\b/)||[])[1],proof=sec.verified.join(" ");
  if(!sum&&!proof)return '<section class="fld outc" aria-label="What was done"><h3 class="lbl">'+ic(I.check,14)+'What was done</h3><p class="sub">This card is done, but no summary was written on it.</p></section>';

/* What this viewer can do to the card. A gate is the owner's yes before a card starts, so for the owner an
   agent card with an open gate has ONE button, "Approve and start": the start request is the approval.
   "Approve" alone exists only where starting is not possible: a card that is yours, or one in progress. */
function actionBar(c,p){
  if(!CAP.db)return '<p class="sro">Read-only here: this view cannot send actions.</p>';
  var pend=pendingMoveOf(c.id);
  if(pend.length)return '<p class="spend"><b>Sent, waiting for the agent.</b> '+esc(pendLabel(c.id))+'.</p><button class="btn btn-tonal btn-sm" data-act="seeinbox">See your requests</button>';
  var gated=c.gate!=="-"&&!DIFF[c.id],out="",hint="";   /* a differing card offers no approval */
  var approve='<button class="btn btn-tonal" data-act="approve" data-id="'+esc(c.id)+'">'+ic(I.check,18)+'Approve</button>';
  if(p==="DONE")return '<span class="chip c-DONE">'+ic(I.check,12)+'Done'+(verified(c)?" and confirmed":"")+'</span>';
  if(c.st==="START"&&cardNeed(c.id))return '<span class="chip c-q"><i></i>Needs you: '+esc(cardNeed(c.id).charAt(0).toLowerCase()+cardNeed(c.id).slice(1))+'</span>'+(qsOf(c.id).length?qsOf(c.id).map(function(q){return '<p class="qtext">'+esc(q.text)+'</p>'+qAnswerHTML(q,"sheet")}).join(""):'<p class="hint">Open Needs you to act on it.</p>');
  if(c.st==="START")return '<span class="chip c-START"><i></i>Agent is on it</span>'+(gated&&CAP.owner?approve:"")+'<p class="hint">It moves to Done once its done-when is confirmed.</p>';
  if(c.own==="agent"&&p!=="BLOCKED"){
    var sb=startBlock(c);
    out+='<button class="btn btn-filled" data-act="start" data-id="'+esc(c.id)+'"'+(sb?' aria-disabled="true" data-tip="'+esc(sb)+'" data-tip-pos="up right wrap"':"")+'>'+ic(I.play,18)+(gated&&CAP.owner?"Approve and start":"Start with the agent")+'</button>';
    if(sb)hint=sb;
  }
  if(c.own==="human"&&gated&&CAP.owner)out+=approve;
  if(CAP.owner&&!isDraft())out+='<button class="btn btn-outlined" data-act="moveto" data-id="'+esc(c.id)+'" data-c="DONE">'+(verified(c)?"Mark done":"Confirm and close")+'</button>';
  if(!CAP.owner)hint+=(hint?" ":"")+"Only the owner can mark a card done or approve a gate.";
  else if(isDraft()&&!hint)hint=DRAFT_WHY;
  return out+(hint?'<p class="hint">'+esc(hint)+'</p>':"");
}

/* A DRAFT plan: the owner reads it here, changes what is wrong, then accepts it. Until then no card can start
   or close; the gateway refuses the same things, so this is a courtesy, not the lock. */

  if(!CAP.db)return say("This view is read-only, so it cannot send the request.");

  if(allActs().some(function(a){return a.verb==="plan.accept"&&a.status==="pending"}))return say("Already sent. The plan is accepted when a session next runs the inbox.");

}

  var cur=document.activeElement&&document.activeElement.classList.contains("card")?document.activeElement:null;
  if(!cur){cards[0].focus();cards[0].scrollIntoView({block:"nearest"});return true}

  clock:CLOCK,lines:function(){return L},now:function(){return NOW},need:function(){return NEED},nowText:function(){var d=document.createElement("div");d.innerHTML=NOWMORE;return d.textContent||""},dg:{used:dgUsed,facts:dgFacts,cap:DG_CAP,from:function(){return DG_FROM}},paused:pausedNow,today:todayFacts,quietMin:function(){return QUIET_MIN}};
/* one goal is always open: the one named in the address (#goal-3), else the one opened earlier in this visit, else Goal 1 */
(function(){var ok=function(n){return D.goals.some(function(g){return g.n===+n})?+n:0},h=(String(location.hash).match(/^#goal-?(\d+)$/)||[])[1],ss=0;
  try{ss=sessionStorage.getItem("lob.goal")}catch(e){}
  S.goal=ok(h)||ok(ss)||+V.views.all[0]||D.goals[0].n;
  /* the view: the one named in the address, else the one chosen earlier in this visit, else Live */
  var hv=String(location.hash).slice(1),sv2="";try{sv2=sessionStorage.getItem("lob.view")||""}catch(e){}
  S.view=VIEW_OK[hv]?hv:h?"board":VIEW_OK[sv2]?sv2:"live"})();
window.addEventListener("hashchange",function(){var v=String(location.hash).slice(1),g=(v.match(/^goal-?(\d+)$/)||[])[1];if(g){setGoal(+g);setView("board");S.scrollGoal=true;render()}else if(VIEW_OK[v]&&v!==S.view){setView(v);render()}});
/* PENDTICK */setInterval(function(){try{if(allActs().some(function(a){return a.status==="pending"})&&!typingIn())render()}catch(e){}},10000);
$("canvas").addEventListener("scroll",function(){if(S.view==="live")nyBar()},{passive:true});
render();
/* ══════════ capabilities ══════════
   Each may resolve to nothing (a file opened from disk, a viewer without access): the page then reads. */
if(window.claude&&window.claude.use){
  var use=function(n){try{return Promise.resolve(window.claude.use(n)).catch(function(){return null})}catch(e){return Promise.resolve(null)}};
  use("user").then(function(u){return u&&u.isOwner?u.isOwner():false}).then(function(v){CAP.owner=!!v}).catch(function(){})
    .then(function(){return use("db")}).then(function(d){
      CAP.db=d||null;if(!d){return}
      render();
      liveFeed(d);
      try{d.collection("cards").onSnapshot(takeCards,function(){})}catch(e){}
      ["actions","approvals"].forEach(function(col){
        try{d.collection(col).orderBy("askedAt","desc").limit(20).onSnapshot(function(snap){takeActs(col,snap)},function(){})}catch(e){}
      });
    }).catch(function(){});
  use("comments").then(function(c){CAP.comments=c||null;refreshSession()});
  use("sample").then(function(s){CAP.sample=s||null;if(s&&(S.view==="board"||S.view==="live"))renderCanvas();if(s)setTimeout(dgAuto,1500)});
  /* what this viewer has seen is written down as they leave, so the next visit knows what is new */
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")dgSeen()});
  window.addEventListener("pagehide",dgSeen);
}
/* times on the page are relative ("3 min ago"): keep them true while the page stays open */
/* the same turn of the clock re-reads the Now state: working becomes quiet with no reload and no new line */
setInterval(function(){if(typingIn())return;if(drag||S.dialog||S.palette)return;tick();refreshSession()},30000);
})();
</script>
